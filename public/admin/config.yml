# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# 字段要和 src/content.config.ts 保持一致，改一边要同步改另一边。

backend:
  name: github
  repo: catteacher0515/Pingyu-s-Garden
  branch: astro-v2 # 新站正式上线、合并到 main 之后改成 main
  # 没有部署 OAuth 中转服务，「使用 GitHub 登录」会一直卡在 Signing in，所以只开放令牌登录
  auth_methods: [token]

site_url: https://huapingyu.cn

media_folder: public/media/uploads
public_folder: /media/uploads

output:
  omit_empty_optional_fields: true

collections:
  - name: videos
    label: 视频
    label_singular: 视频
    folder: src/content/videos
    slug: '{{year}}{{month}}{{day}}-{{uuid_shorter}}'
    create: true
    sortable_fields: [date, title]
    summary: '{{title}}（{{date}}）'
    fields:
      - { name: url, label: B 站视频链接, hint: '只填这一项就能发布：保存后几分钟内，网站会自动从 B 站读取标题、日期、时长、封面、简介和章节。下面的内容都可以不填；填了的不会被覆盖。' }
      - { name: series, label: 分类, widget: select, options: [工具上手, AI 认知, 日常], required: false, hint: '可不填，不填归到「其他」' }
      - { name: title, label: 标题, required: false, hint: '可不填，自动用 B 站标题' }
      - { name: summary, label: 一句话简介, widget: text, required: false, hint: '可不填，自动取 B 站简介第一句' }
      - { name: cover, label: 封面图, widget: image, required: false, hint: '可不填，自动下载 B 站封面' }
      - { name: tags, label: 标签, widget: list, required: false }
      - { name: draft, label: 草稿（不发布）, widget: boolean, default: false }
      - { name: date, label: 发布日期, widget: datetime, time_format: false, format: YYYY-MM-DD, default: '{{now}}', hint: '不用改，会自动换成 B 站的发布日期' }
      - { name: platform, label: 平台, widget: select, options: [B站, YouTube, 小红书, 视频号, 抖音], default: B站 }
      - { name: duration, label: 时长, required: false, hint: '可不填，自动读取' }
      - name: chapters
        label: 章节
        widget: list
        required: false
        hint: '可不填，自动读取 B 站分段章节；视频页点章节会在 B 站从那里开始播'
        fields:
          - { name: at, label: 开始时间, hint: '例如 1:05' }
          - { name: title, label: 章节名 }
      - { name: preview, label: 预览片段, widget: file, required: false, hint: '可选：3 到 6 秒的静音 mp4，鼠标悬停在视频卡片上时播放，建议小于 3MB。' }
      - { name: body, label: 视频说明 / 资料, widget: markdown, required: false, hint: '可不填，自动用 B 站简介' }

  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    slug: '{{year}}{{month}}{{day}}-{{uuid_shorter}}'
    create: true
    sortable_fields: [date, title, category]
    summary: '【{{category}}】{{title}}'
    view_groups:
      - { label: 分类, field: category }
    fields:
      - { name: title, label: 标题 }
      - { name: body, label: 正文, widget: markdown, hint: '直接粘贴 Markdown 也可以；图片拖进来会自动上传' }
      - { name: cover, label: 封面图, widget: image, required: false, hint: '可不填，列表里会显示文字占位' }
      - { name: tags, label: 标签, widget: list, required: false, hint: '第一个标签就是文章页的分类，例如 AI 工具箱' }
      - { name: summary, label: 一句话简介, widget: text, required: false, hint: '可不填，自动取正文开头' }
      - { name: origin, label: 首发链接, required: false, hint: '可不填。也发在知乎等平台时填原文地址，文末会显示「本文首发于…」' }
      - { name: date, label: 发布日期, widget: datetime, time_format: false, format: YYYY-MM-DD, default: '{{now}}', required: false }
      - { name: draft, label: 草稿（不发布）, widget: boolean, default: false }
      - { name: category, label: 类型, widget: select, options: [文章, 教程], default: 文章, hint: '不用改' }

  - name: projects
    label: 项目
    label_singular: 项目
    folder: src/content/projects
    slug: '{{slug}}'
    create: true
    sortable_fields: [order, title]
    summary: '{{order}}. {{title}}'
    fields:
      - { name: title, label: 项目名 }
      - { name: tagline, label: 一句话介绍, widget: text }
      - { name: period, label: 时间, required: false, hint: '例如 2026.02' }
      - { name: role, label: 我的角色, required: false, hint: '例如：独立开发 / 后端负责人' }
      - { name: stack, label: 技术栈, widget: list, required: false }
      - { name: highlights, label: 三条亮点, widget: list, required: false, hint: '面试官最该看到的三件事，最好带数据' }
      - { name: cover, label: 封面或截图, widget: image, required: false }
      - { name: repo, label: GitHub 地址, required: false }
      - { name: demo, label: 在线演示地址, required: false }
      - { name: noteTopic, label: 关联笔记的主题, required: false, hint: '和 Obsidian 笔记的 topic 一致，这些笔记会自动列在项目页底部' }
      - { name: order, label: 排序（越小越靠前）, widget: number, value_type: int, default: 1 }
      - { name: wip, label: 开发中（只显示卡片，不开放详情页）, widget: boolean, default: false }
      - { name: draft, label: 草稿（不发布）, widget: boolean, default: false }
      - { name: body, label: 项目详情, widget: markdown, required: false, hint: '建议分「背景 / 我做了什么 / 技术难点 / 结果」四节' }

  - name: rants
    label: 发发神经
    label_singular: 一条神经
    description: 牢骚、碎碎念和小感悟。不用写标题，写几句话就能发。
    folder: src/content/rants
    slug: '{{year}}{{month}}{{day}}-{{uuid_shorter}}'
    create: true
    sortable_fields: [date]
    summary: '{{date}} {{mood}}'
    fields:
      - { name: date, label: 时间, widget: datetime, default: '{{now}}' }
      - { name: mood, label: 心情, widget: select, required: false, options: ['🫠', '😤', '🙃', '😭', '😮‍💨', '🤔', '🥲', '😌', '🥳', '💡'] }
      - { name: draft, label: 草稿（不发布）, widget: boolean, default: false }
      - { name: body, label: 想说的话, widget: markdown }

  - name: settings
    label: 网站设置
    files:
      - name: site
        label: 首页文字和关注我
        file: src/data/site.json
        fields:
          - { name: name, label: 名字 }
          - { name: role, label: 身份, required: false, hint: '名字上方的小标签，不想显示就留空' }
          - { name: tagline, label: 一句话介绍, widget: text, hint: '首页不显示；用在搜索结果和分享卡片的简介里' }
          - { name: icp, label: ICP 备案号, required: false, hint: '备案通过后填，例如 冀ICP备2026042324号-2，会显示在页脚' }
          - { name: now, label: 正在做（首页轮换显示）, widget: list }
          - name: follow
            label: 关注我（填了链接或复制内容的才会显示）
            widget: list
            fields:
              - { name: name, label: 平台 }
              - { name: handle, label: 账号名, required: false }
              - { name: desc, label: 在那里能看到什么, required: false, hint: '一句话，例如 教程和长视频' }
              - { name: url, label: 链接, required: false, hint: '主页地址，例如 https://space.bilibili.com/你的UID ；邮箱写 mailto:你的邮箱' }
              - { name: copy, label: 点击复制的内容, required: false, hint: '没有主页链接的平台（如微信）填这里，访客点卡片会复制它，例如微信号' }
