<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 C · 色块</title>
<style>
:root{--bg:#f4f3ef;--ink:#0d0d0d;--blue:#2b3cff;--lime:#d8ff3d;--pink:#ff7ab6;--mute:#6f6e69;--ease:cubic-bezier(.2,.9,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",-apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.badge-proto{position:fixed;left:16px;bottom:16px;z-index:999;background:var(--ink);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;opacity:.8}
.mono{font-family:ui-monospace,Menlo,monospace}

/* header */
.top{display:grid;grid-template-columns:1fr auto auto auto auto;gap:40px;align-items:center;padding:20px 32px;border-bottom:2px solid var(--ink);font-size:14px;font-weight:600}
.top a{position:relative;overflow:hidden;display:inline-block;height:1.2em}
.top a span{display:block;transition:transform .35s var(--ease)}
.top a span::after{content:attr(data-t);display:block;color:var(--blue)}
.top a:hover span{transform:translateY(-100%)}

/* hero */
.hero{padding:30px 32px 0;border-bottom:2px solid var(--ink)}
.hero h1{font-size:19vw;line-height:.95;letter-spacing:-.07em;font-weight:900;white-space:nowrap;padding-bottom:10px}
.hero h1 .hl{display:inline-block;width:.16em;height:.16em;background:var(--blue);margin-left:.06em;vertical-align:baseline}
.hero h1 .hl{color:var(--blue)}
.ticker{display:flex;justify-content:space-between;align-items:center;padding:18px 0 22px;font-size:16px;font-weight:600}
.ticker .now{display:flex;gap:10px;align-items:center}
.ticker .now b{background:var(--lime);padding:4px 10px}

/* bento */
.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:150px;border-left:2px solid var(--ink)}
.tile{position:relative;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:20px;cursor:pointer;overflow:hidden;background:var(--bg);transition:background .3s}
.tile:hover{background:#fff}
.tile .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;display:flex;justify-content:space-between}
.tile .arrow{transition:transform .4s var(--ease)}
.tile:hover .arrow{transform:translate(4px,-4px) rotate(-45deg)}
.t-video{grid-column:span 7;grid-row:span 3;background:var(--blue);color:#fff}
.t-video:hover{background:#1f2ee6}
.t-video .frame{position:absolute;left:20px;right:20px;bottom:20px;top:56px;overflow:hidden}
.t-video .frame div{position:absolute;inset:-10%;transition:transform 1s var(--ease)}
.t-video:hover .frame div{transform:scale(1.06)}
.t-video h3{position:absolute;left:44px;bottom:44px;right:44px;font-size:40px;line-height:1.15;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.t-video .len{position:absolute;right:40px;top:76px;background:var(--lime);color:var(--ink);font-weight:700;font-size:13px;padding:4px 10px}
.t-tut{grid-column:span 5;grid-row:span 2}
.t-tut ol{list-style:none;margin-top:14px}
.t-tut li{display:flex;justify-content:space-between;font-size:22px;font-weight:700;letter-spacing:-.01em;padding:10px 0;border-top:1.5px solid var(--ink)}
.t-tut li small{font-size:13px;color:var(--mute);font-weight:600}
.t-count{grid-column:span 5;grid-row:span 1;background:var(--lime);display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
.t-count div{display:flex;align-items:baseline;gap:8px}
.t-count .n{font-size:72px;font-weight:900;letter-spacing:-.06em;line-height:1}
.t-count span{font-size:15px;font-weight:700}
.t-notes{grid-column:span 4;grid-row:span 2}
.t-notes .bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:20px}
.t-notes .bar{flex:1;background:var(--ink);position:relative;transform-origin:bottom}
.t-notes .bar span{position:absolute;bottom:-22px;left:0;font-size:11px;font-weight:700;white-space:nowrap}
.t-rant{grid-column:span 5;grid-row:span 2;background:var(--pink)}
.t-rant q{display:block;font-size:34px;line-height:1.3;font-weight:800;letter-spacing:-.02em;margin-top:18px;quotes:"「" "」"}
.t-rant small{display:block;margin-top:14px;font-weight:600}
.t-follow{grid-column:span 3;grid-row:span 2;background:var(--ink);color:#fff}
.t-follow:hover{background:#000}
.t-follow ul{list-style:none;margin-top:16px}
.t-follow li{font-size:22px;font-weight:800;padding:5px 0;display:flex;justify-content:space-between}
.t-follow li span{color:var(--lime);font-size:13px}
.t-more{grid-column:span 12;grid-row:span 1;display:flex;align-items:center;justify-content:center;gap:60px;font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden}
.t-more .mq{display:flex;gap:60px}

/* expanded overlay */
.tile.expanded{position:fixed;inset:0;z-index:200;cursor:default;overflow:auto;border:none;padding:40px 60px}
.tile.expanded .detail{display:block}
.tile.expanded .close{display:grid}
.detail{display:none;margin-top:40px}
.close{display:none;position:fixed;right:30px;top:26px;width:54px;height:54px;border-radius:50%;background:var(--ink);color:#fff;place-items:center;font-size:22px;cursor:pointer;z-index:2}
.t-video.expanded .close{background:var(--lime);color:var(--ink)}
.t-video.expanded .frame{position:relative;inset:auto;height:56vh;margin-top:30px}
.t-video.expanded h3{position:relative;left:auto;bottom:auto;right:auto;font-size:52px;margin-top:28px;text-shadow:none}
.t-video.expanded .len{display:none}
.tile.expanded .bars{display:none}
.vlist{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:60px}
.vlist div .th{aspect-ratio:16/9}
.vlist b{display:block;margin-top:10px;font-size:17px;line-height:1.35}
.vlist small{opacity:.7;font-size:13px}
.nlist{margin-top:10px}
.nlist a{display:grid;grid-template-columns:60px 1fr 160px 80px;padding:22px 0;border-top:2px solid var(--ink);font-size:30px;font-weight:800;letter-spacing:-.02em;transition:background .2s,padding .3s var(--ease)}
.nlist a:hover{background:var(--lime);padding-left:12px}
.nlist small{font-size:14px;font-weight:600;color:var(--mute)}
.rlist{columns:2;column-gap:30px;margin-top:20px}
.rlist div{break-inside:avoid;background:#fff;border:2px solid var(--ink);padding:22px;margin-bottom:30px;font-size:24px;font-weight:700;line-height:1.45}
.rlist div small{display:block;margin-top:10px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="badge-proto">原型 C · 色块 · 内容均为示例 · 点任意一格会展开</div>

<header class="top">
  <b class="mono">PINGYU / 花萍雨</b>
  <a href="#"><span data-t="视频">视频</span></a><a href="#"><span data-t="教程 & 笔记">教程 & 笔记</span></a><a href="#"><span data-t="发发神经">发发神经</span></a><a href="#"><span data-t="关注我 ↗">关注我 ↗</span></a>
</header>

<section class="hero">
  <h1 id="title">花萍雨<span class="hl"></span></h1>
  <div class="ticker"><span class="now">正在 <b id="now"></b></span><span id="tag"></span><span class="mono" id="clock"></span></div>
</section>

<main class="grid" id="grid">
  <div class="tile t-video" data-flip>
    <div class="lbl"><span>最新视频</span><span class="arrow">↗</span></div>
    <div class="frame"><div id="vbg"></div></div><span class="len" id="vlen"></span><h3 id="vtitle"></h3>
    <div class="close">✕</div>
    <div class="detail"><div class="vlist" id="vlist"></div></div>
  </div>
  <div class="tile t-tut" data-flip>
    <div class="lbl"><span>教程</span><span class="arrow">↗</span></div>
    <ol id="tut"></ol>
    <div class="close">✕</div>
    <div class="detail"><h2 style="font-size:90px;letter-spacing:-.05em">教程</h2><div class="nlist" id="tutAll"></div></div>
  </div>
  <div class="tile t-count">
    <div><span class="n" data-count="videos">0</span><span>支视频</span></div><div><span class="n" data-count="tutorials">0</span><span>篇教程</span></div><div><span class="n" data-count="notes">0</span><span>篇笔记</span></div>
  </div>
  <div class="tile t-notes" data-flip>
    <div class="lbl"><span>笔记 · 按主题</span><span class="arrow">↗</span></div>
    <div class="bars" id="bars"></div>
    <div class="close">✕</div>
    <div class="detail"><h2 style="font-size:90px;letter-spacing:-.05em">笔记</h2><div class="nlist" id="notesAll"></div></div>
  </div>
  <div class="tile t-rant" data-flip>
    <div class="lbl"><span>发发神经</span><span class="arrow">↗</span></div>
    <q id="rant"></q><small id="rantT"></small>
    <div class="close">✕</div>
    <div class="detail"><h2 style="font-size:90px;letter-spacing:-.05em">发发神经</h2><div class="rlist" id="rantsAll"></div></div>
  </div>
  <div class="tile t-follow">
    <div class="lbl"><span>关注我</span><span class="arrow">↗</span></div>
    <ul id="follow"></ul>
  </div>
  <div class="tile t-more"><div class="mq" id="mq"></div></div>
</main>

<script src="assets/data.js"></script>
<script src="assets/gsap.min.js"></script>
<script src="assets/Flip.min.js"></script>
<script src="assets/SplitText.min.js"></script>
<script src="assets/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(Flip, SplitText, ScrollTrigger)
const S = window.SITE, $ = (s) => document.querySelector(s)
const pal = [['#2b3cff', '#8f9bff'], ['#ff7ab6', '#ffd1e6'], ['#0d0d0d', '#5c5c5c'], ['#d8ff3d', '#f4ffc4'], ['#ff5a1f', '#ffb199']]

$('#tag').textContent = S.tagline
const v = S.videos[0]
$('#vbg').style.background = thumb(0, [['#0d0d0d', '#ff7ab6']])
$('#vlen').textContent = v.len
$('#vtitle').textContent = v.title
$('#vlist').innerHTML = S.videos.slice(1).map((x, i) => `<div><div class="th" style="background:${thumb(i + 1, pal)}"></div><b>${x.title}</b><small>${x.date} · ${x.views} 播放</small></div>`).join('')
$('#tut').innerHTML = S.tutorials.map((t) => `<li>${t.title}<small>${t.mins} min</small></li>`).join('')
$('#tutAll').innerHTML = S.tutorials.map((t, i) => `<a href="#"><small>0${i + 1}</small>${t.title}<small>${t.tag}</small><small>${t.mins} 分钟</small></a>`).join('')
const topics = {}; S.notes.forEach((n) => (topics[n.topic] = (topics[n.topic] || 0) + 1))
$('#bars').innerHTML = Object.entries(topics).map(([t, c]) => `<div class="bar" data-h="${c}"><span>${t} ${c}</span></div>`).join('')
$('#notesAll').innerHTML = S.notes.map((n) => `<a href="#"><small>${n.status}</small>${n.title}<small>${n.topic}</small><small>${n.updated}</small></a>`).join('')
$('#rant').textContent = S.rants[0].text
$('#rantT').textContent = S.rants[0].mood + ' ' + S.rants[0].t
$('#rantsAll').innerHTML = S.rants.map((r) => `<div>${r.mood} ${r.text}<small>${r.t}</small></div>`).join('')
$('#follow').innerHTML = S.follow.map((f) => `<li>${f.name}<span>↗</span></li>`).join('')
const mqText = ['视频', '教程', '笔记', '发发神经', '关注我'].map((t) => `<span>${t} ✺</span>`).join('')
$('#mq').innerHTML = mqText.repeat(6)

// 正在 / 时钟
let ni = 0; $('#now').textContent = S.now[0]
setInterval(() => { gsap.to('#now', { scaleY: 0, duration: .2, onComplete: () => { ni = (ni + 1) % S.now.length; $('#now').textContent = S.now[ni]; gsap.to('#now', { scaleY: 1, duration: .3, ease: 'back.out(3)' }) } }) }, 2600)
setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }) }, 1000)

// 入场
const sp = new SplitText('#title', { type: 'chars' })
const tl = gsap.timeline()
tl.from(sp.chars, { yPercent: 100, stagger: .08, duration: 1, ease: 'expo.out' })
  .from('.ticker > *', { y: 20, opacity: 0, stagger: .08, duration: .6 }, '-=.5')
  .from('.tile', { clipPath: 'inset(0 0 100% 0)', stagger: .06, duration: .8, ease: 'expo.inOut' }, '-=.3')
  .from('.bar', { scaleY: 0, stagger: .1, duration: .8, ease: 'back.out(2)' }, '-=.4')
document.querySelectorAll('.bar').forEach((b) => (b.style.height = 30 + b.dataset.h * 55 + 'px'))
document.querySelectorAll('[data-count]').forEach((el) => gsap.to({ n: 0 }, { n: S[el.dataset.count].length, duration: 1.4, delay: 1.2, ease: 'power2.out', onUpdate() { el.textContent = Math.round(this.targets()[0].n) } }))
gsap.to('#mq', { xPercent: -50, duration: 30, ease: 'none', repeat: -1 })

// 点击格子：就地展开成全屏（Flip）
let opened = null
document.querySelectorAll('[data-flip]').forEach((t) => {
  t.addEventListener('click', (e) => {
    if (opened) { if (e.target.closest('.close')) toggle(t); return }
    toggle(t)
  })
})
function toggle(t) {
  const state = Flip.getState(t)
  const opening = !t.classList.contains('expanded')
  t.classList.toggle('expanded', opening)
  document.body.style.overflow = opening ? 'hidden' : ''
  opened = opening ? t : null
  Flip.from(state, { duration: .7, ease: 'expo.inOut', absolute: true, zIndex: 200 })
  if (opening) gsap.from(t.querySelectorAll('.detail > *, .vlist > div, .nlist a, .rlist div'), { y: 40, opacity: 0, stagger: .05, duration: .6, delay: .45, ease: 'expo.out' })
}
addEventListener('keydown', (e) => { if (e.key === 'Escape' && opened) toggle(opened) })

// 磁吸：鼠标靠近格子时箭头被吸过去
document.querySelectorAll('.tile .arrow').forEach((a) => {
  const tile = a.closest('.tile')
  tile.addEventListener('mousemove', (e) => { const r = a.getBoundingClientRect(); gsap.to(a, { x: (e.clientX - r.left - r.width / 2) * .15, y: (e.clientY - r.top - r.height / 2) * .15, duration: .4 }) })
  tile.addEventListener('mouseleave', () => gsap.to(a, { x: 0, y: 0, duration: .5, ease: 'elastic.out(1,.4)' }))
})
</script>
</body>
</html>
