<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>C · IP 互动主角</title>
<link rel="stylesheet" href="_base.css">
<style>
  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 40px; perspective: 1200px; }
  .glow { position: absolute; left: 50%; top: 52%; width: 620px; height: 620px; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--hot) 40%, transparent), transparent); filter: blur(20px); z-index: 0; }
  .ring { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; border: 1.5px dashed var(--line); border-radius: 50%; transform: translate(-50%, -54%); animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: translate(-50%, -54%) rotate(360deg); } }
  .orbit { position: absolute; left: 50%; top: 50%; z-index: 2; }
  .orbit a { position: absolute; transform: translate(-50%, -50%); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 15px; box-shadow: 0 10px 24px -16px rgba(28,33,64,.5); transition: background .25s, transform .4s var(--ease); white-space: nowrap; }
  .orbit a small { color: var(--mute); font-weight: 500; margin-left: 6px; }
  .orbit a:hover { background: var(--hot); transform: translate(-50%, -50%) scale(1.08); }
  .stage { position: relative; z-index: 1; width: 380px; height: 440px; margin-top: 30px; transform-style: preserve-3d; transition: transform .2s ease-out; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .3s, transform .45s var(--ease); }
  .stage img.off { opacity: 0; transform: scale(.92) translateY(10px); }
  .bubble { position: absolute; left: 50%; top: -6px; z-index: 3; transform: translate(-50%, -100%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 18px; font-weight: 700; font-size: 16px; white-space: nowrap; transition: transform .35s var(--ease), opacity .2s; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: var(--ink); transform: translateX(-50%) rotate(45deg); }
  .bubble.pop { transform: translate(-50%, -100%) scale(1.12); }
  .name { position: relative; z-index: 2; text-align: center; margin-top: 10px; }
  .name .role { color: var(--navy); font-weight: 700; font-size: 15px; }
  .name h1 { font-size: 56px; letter-spacing: -.05em; font-weight: 850; line-height: 1.05; }
  .name p { color: var(--mute); font-size: 16px; margin-top: 6px; }
  .hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--mute); }
</style></head>
<body>
<header class="bar"><a class="brand">花萍雨 / Pingyu</a><nav><a>项目</a><a>笔记</a><a>文章</a><a>视频</a><a>发发神经</a><a>关注我</a><a>搜索 ⌘K</a></nav></header>
<section class="screen hero">
  <div class="glow"></div><div class="ring"></div>
  <div class="orbit" id="orbit">
    <a href="#" style="left:-420px; top:-170px">项目<small>3</small></a>
    <a href="#" style="left:420px; top:-190px">笔记<small>1</small></a>
    <a href="#" style="left:-470px; top:60px">文章<small>13</small></a>
    <a href="#" style="left:470px; top:40px">视频<small>10</small></a>
    <a href="#" style="left:-360px; top:250px">发发神经</a>
    <a href="#" style="left:360px; top:260px">关注我</a>
  </div>
  <div class="stage" id="stage" data-cursor>
    <div class="bubble" id="bubble">嗨！点我一下 👋</div>
    <img src="../../../public/brand/wave.webp" alt="">
  </div>
  <div class="name">
    
    <h1>花萍雨<span class="dot">.</span></h1>
    <p>让大模型会查资料、会用工具，能自己把事情做完。</p>
  </div>
  <p class="hint">移动鼠标，他会转向你；点他，换个表情</p>
</section>
<script>
const poses = [
  ['wave', '嗨！点我一下 👋'], ['laptop', '我在写 Agent，别打扰我…开玩笑的'], ['idea', '想到一个点子！'],
  ['thumbs', '你能看到这里，很棒'], ['present', '来看看我的项目？'], ['notes', '学到的都记在笔记里'],
  ['chin', '让我想想…'], ['facepalm', '这个 bug 又是我写的'], ['point', '往下滑，内容在下面 ↓'],
]
const stage = document.getElementById('stage'), bubble = document.getElementById('bubble')
const imgs = poses.map(([k], i) => { if (i === 0) return stage.querySelector('img'); const im = new Image(); im.src = `../../../public/brand/${k}.webp`; im.className = 'off'; stage.appendChild(im); return im })
let i = 0
stage.addEventListener('click', () => {
  imgs[i].classList.add('off'); i = (i + 1) % poses.length; imgs[i].classList.remove('off')
  bubble.textContent = poses[i][1]; bubble.classList.add('pop'); setTimeout(() => bubble.classList.remove('pop'), 250)
})
// 整个形象朝鼠标方向轻微转动；环绕的入口也跟着轻轻视差
const orbit = document.getElementById('orbit')
addEventListener('pointermove', (e) => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5
  stage.style.transform = `rotateY(${x * 18}deg) rotateX(${-y * 12}deg)`
  orbit.style.transform = `translate(${x * -18}px, ${y * -12}px)`
})
</script>
</body></html>
