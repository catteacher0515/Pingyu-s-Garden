<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>D · B + C 组合</title>
<link rel="stylesheet" href="_base.css">
<style>
  .hero { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 30px; perspective: 1200px; }
  .glow { position: absolute; left: 50%; top: 50%; width: 620px; height: 620px; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(closest-side, color-mix(in srgb, var(--hot) 40%, transparent), transparent); filter: blur(20px); }
  .ring { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; border: 1.5px dashed var(--line); border-radius: 50%; transform: translate(-50%, -54%); animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: translate(-50%, -54%) rotate(360deg); } }
  .orbit { position: absolute; left: 50%; top: 50%; z-index: 2; }
  /* 环绕入口：胶囊大小固定不变（悬停区域稳定），详情是另一张浮层卡，不占位、不接收鼠标 */
  .pill { position: absolute; display: flex; align-items: baseline; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 12px 20px; box-shadow: 0 10px 24px -16px rgba(28,33,64,.5); white-space: nowrap; transition: background .25s, box-shadow .3s; }
  .pill.l { transform: translate(-100%, -50%); }
  .pill.r { transform: translate(0, -50%); }
  .pill b { font-size: 18px; }
  .pill small { color: var(--mute); font-size: 13px; transition: color .25s; }
  .pill .pop { position: absolute; top: calc(100% + 10px); width: 250px; padding: 12px 16px; border-radius: 14px; background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1.55; white-space: normal; pointer-events: none; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .3s var(--ease); }
  .pill.l .pop { right: 0; }
  .pill.r .pop { left: 0; }
  .pill .pop i { font-style: normal; color: var(--hot); font-weight: 700; margin-right: 6px; }
  .pill:hover { background: var(--hot); box-shadow: 0 16px 30px -18px rgba(28,33,64,.6); }
  .pill:hover small { color: var(--ink); }
  .pill:hover .pop { opacity: 1; transform: none; transition-delay: .08s; }
  .stage { position: relative; z-index: 1; width: 380px; height: 440px; margin-top: 30px; transform-style: preserve-3d; will-change: transform; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .2s ease .13s; }
  .stage img.off { opacity: 0; transition: opacity .13s ease; }
  .bubble { position: absolute; left: 50%; top: -6px; z-index: 3; transform: translate(-50%, -100%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 18px; font-weight: 700; font-size: 16px; white-space: nowrap; transition: transform .35s var(--ease), opacity .15s; }
  .bubble.fade { opacity: 0; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: var(--ink); transform: translateX(-50%) rotate(45deg); }
  .bubble.pop { transform: translate(-50%, -100%) scale(1.08); }
  .name { position: relative; z-index: 2; text-align: center; margin-top: 10px; }
  .name h1 { font-size: 60px; letter-spacing: -.05em; font-weight: 850; line-height: 1.05; }
  .name p { color: var(--mute); font-size: 16px; margin-top: 6px; }
  .hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--mute); }
</style></head>
<body>
<header class="bar"><a class="brand">花萍雨 / Pingyu</a><nav><a>项目</a><a>笔记</a><a>文章</a><a>视频</a><a>发发神经</a><a>关注我</a><a>搜索 ⌘K</a></nav></header>
<section class="screen hero">
  <div class="glow"></div><div class="ring"></div>
  <div class="orbit" id="orbit">
    <a href="#" class="pill l" style="left:-340px; top:-180px" data-ip="laptop" data-say="这三个项目我正在做"><b>项目</b><small>3 个</small><span class="pop"><i>开发中</i>AI 超级智能体 · AI 修图智能体 · 内容运营工作台</span></a>
    <a href="#" class="pill r" style="left:340px; top:-190px" data-ip="notes" data-say="学到的都记在这里"><b>笔记</b><small>1 篇</small><span class="pop"><i>最新</i>Python 工程能力-古法练习</span></a>
    <a href="#" class="pill l" style="left:-390px; top:50px" data-ip="point" data-say="想清楚的写成文章"><b>文章</b><small>13 篇</small><span class="pop"><i>最新</i>这个 GitHub 项目，帮你完成公众号排版</span></a>
    <a href="#" class="pill r" style="left:390px; top:40px" data-ip="present" data-say="做的过程都拍下来了"><b>视频</b><small>10 支</small><span class="pop"><i>最新</i>电脑一合盖 AI 就罢工？问题出在这一个勾上</span></a>
    <a href="#" class="pill l" style="left:-290px; top:250px" data-ip="facepalm" data-say="这里随便发发牢骚"><b>发发神经</b><small>1 条</small><span class="pop"><i>10.15</i>测试站长编辑功能</span></a>
    <a href="#" class="pill r" style="left:290px; top:260px" data-ip="thumbs" data-say="在这些地方都能找到我"><b>关注我</b><small>6 个平台</small><span class="pop">B 站 · 抖音 · 小红书 · 知乎 · GitHub · 微信</span></a>
  </div>
  <div class="stage" id="stage" data-cursor>
    <div class="bubble" id="bubble">嗨！点我一下 👋</div>
  </div>
  <div class="name">
    <h1>花萍雨<span class="dot">.</span></h1>
    <p>让大模型会查资料、会用工具，能自己把事情做完。</p>
  </div>
  <p class="hint">移动鼠标他会转向你 · 点他换表情 · 指向周围的入口，他会给你介绍</p>
</section>
<script>
const stage = document.getElementById('stage'), bubble = document.getElementById('bubble')
const imgs = {}
let curPose = ''
const pose = (k) => {
  if (k === curPose) return
  curPose = k
  if (!imgs[k]) { const im = new Image(); im.src = `../../../public/brand/${k}.webp`; im.className = 'off'; stage.appendChild(im); imgs[k] = im }
  Object.values(imgs).forEach((x) => x.classList.add('off'))
  requestAnimationFrame(() => imgs[k].classList.remove('off'))
}
let sayTo = bubble.textContent, sayT = 0
const say = (t, pop) => {
  if (t === sayTo) return
  sayTo = t; clearTimeout(sayT); bubble.classList.add('fade')
  sayT = setTimeout(() => { bubble.textContent = t; bubble.classList.remove('fade'); if (pop) { bubble.classList.add('pop'); setTimeout(() => bubble.classList.remove('pop'), 250) } }, 150)
}
// 点他：按顺序换表情
const clicks = [['wave', '嗨！点我一下 👋'], ['idea', '想到一个点子！'], ['chin', '让我想想…'], ['thumbs', '你能看到这里，很棒'], ['facepalm', '这个 bug 又是我写的'], ['laptop', '我先去写代码了']]
let ci = 0, hovered = null, enterT = 0, leaveT = 0
pose('wave')
stage.addEventListener('click', () => { ci = (ci + 1) % clicks.length; if (!hovered) { pose(clicks[ci][0]); say(clicks[ci][1], true) } })
// 指向入口：停留 120ms 才换姿势（划过不触发）；离开 300ms 后才回到原表情（在入口之间移动不来回闪）
document.querySelectorAll('.pill').forEach((p) => {
  new Image().src = `../../../public/brand/${p.dataset.ip}.webp`
  p.addEventListener('mouseenter', () => {
    clearTimeout(leaveT); clearTimeout(enterT)
    enterT = setTimeout(() => { hovered = p; pose(p.dataset.ip); say(p.dataset.say) }, 120)
  })
  p.addEventListener('mouseleave', () => {
    clearTimeout(enterT)
    leaveT = setTimeout(() => { hovered = null; pose(clicks[ci][0]); say(clicks[ci][1]) }, 300)
  })
})
// 转身：目标角度跟鼠标，实际角度每帧缓慢靠近，动作连贯不抖
let tx = 0, ty = 0, cx = 0, cy = 0
addEventListener('pointermove', (e) => { tx = (e.clientX / innerWidth - .5) * 14; ty = (e.clientY / innerHeight - .5) * -9 })
const loop = () => { cx += (tx - cx) * .08; cy += (ty - cy) * .08; stage.style.transform = `rotateY(${cx.toFixed(2)}deg) rotateX(${cy.toFixed(2)}deg)`; requestAnimationFrame(loop) }
loop()
</script>
</body></html>
