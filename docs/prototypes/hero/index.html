<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>首页第一屏 · B / C / D</title>
<link rel="stylesheet" href="_base.css">
<style>
  html, body { overflow: auto; }
  body { padding: 40px var(--pad) 80px; }
  h1 { font-size: 40px; letter-spacing: -.03em; }
  .sub { color: var(--mute); margin-top: 8px; }
  .item { margin-top: 48px; }
  .item h2 { font-size: 24px; display: flex; align-items: baseline; gap: 14px; }
  .item h2 a { font-size: 15px; color: var(--navy); }
  .item p { color: var(--mute); margin: 6px 0 14px; }
  .frame { width: 100%; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--paper); }
  .frame iframe { width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
</style></head>
<body>
<h1>首页第一屏 · B、C 和组合版 D<span class="dot">.</span></h1>
<p class="sub">每个都能直接在框里点、移动鼠标；点标题旁的「全屏打开」看真实大小。</p>
<div class="item"><h2>B · 名片 + 总览 <a href="b-overview.html" target="_blank">全屏打开 ↗</a></h2><p>左边名片，右边全站目录（数量 + 最新一条）。鼠标移到哪一行，名片上的 IP 就换成对应的姿势。</p><div class="frame"><iframe src="b-overview.html"></iframe></div></div>
<div class="item"><h2>C · IP 互动主角 <a href="c-ip-stage.html" target="_blank">全屏打开 ↗</a></h2><p>IP 站在中间，随鼠标转向；点他会换表情、说一句话。各版块入口环绕在四周。</p><div class="frame"><iframe src="c-ip-stage.html"></iframe></div></div>
<div class="item"><h2>D · B + C 组合 <a href="d-combo.html" target="_blank">全屏打开 ↗</a></h2><p>C 的布局和互动（随鼠标转向、点他换表情），加上 B 的信息：指向周围的入口时，入口展开显示数量和最新一条，IP 换成对应姿势并介绍这一块。</p><div class="frame"><iframe src="d-combo.html"></iframe></div></div>
<script>
const fit = () => document.querySelectorAll('.frame').forEach((f) => { f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1440})` })
addEventListener('resize', fit); fit()
</script>
</body></html>
