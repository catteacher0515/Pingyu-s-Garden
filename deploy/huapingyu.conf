server {
    listen 80;
    listen [::]:80;
    server_name huapingyu.cn www.huapingyu.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/huapingyu/acme;
        try_files $uri =404;
    }
    location / { return 301 https://huapingyu.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.huapingyu.cn;
    ssl_certificate /etc/letsencrypt/live/huapingyu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huapingyu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://huapingyu.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name huapingyu.cn;
    ssl_certificate /etc/letsencrypt/live/huapingyu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huapingyu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/huapingyu/current;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
